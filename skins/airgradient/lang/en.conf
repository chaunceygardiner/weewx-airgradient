# skins/airgradient/lang/en.conf
#
# English -- the demo report's reference dictionary.  Every string the
# page renders is here, and nothing else: tests/test_airgradient.py fails
# if a string rendered by index.html.tmpl is missing from this file, or if
# this file carries a string nothing renders.  It is also the ONLY home for
# the observation labels: skin.conf deliberately carries none, because a
# label left there would shadow its own translation (test-pinned).
#
# Translations are gettext-style: the English string IS the key, and a
# report falls back to the English, one string at a time, for any key
# its language file does not carry -- a partial translation is fine.

[Labels]

    [[Generic]]

        # Observation labels: the page heading and the title of each
        # PNG plot.
        pm2_5_aqi = Air Quality Index
        pm2_5     = PM2.5
        co2       = Carbon Dioxide
        nox       = Nitrogen Oxides
        noxIndex  = Nitrogen Oxides Index
        tvoc      = Total Volatile Organic Compounds
        tvocIndex = Total Volatile Organic Compounds Index

# NO [Units] [[Labels]] HERE.  weewx.units.Formatter.get_label_string
# consults weewx.units.default_unit_label_dict FIRST and only falls back to
# the skin/lang dictionary, and airgradient.py registers aqi, aqi_color,
# tvoc_index and nox_index into that dict at import time.  A [Units] block
# in this file would therefore never render -- it would be dead text that
# looks translated.  Those four labels are the acronyms AQI, RGB, TVOC and
# NOx, which stay as they are in every language anyway.

[ImageGenerator]

    [[year_images]]

        # Restates skin.conf's own default.  Needed because the other lang
        # files override it: with [[Defaults]] lang = de station-wide and
        # lang = en on this report, the German %d.%m. is merged first and
        # nothing here would put the US month/day order back.
        x_label_format = %m/%d


[Texts]

    # -- page strings (index.html.tmpl) -------------------------------
    "weewx-airgradient demo page" = "weewx-airgradient demo page"
    "WeeWX-AirGradient Demo Page" = "WeeWX-AirGradient Demo Page"
    "Unavailable" = "Unavailable"

    # Plot-period tabs, as in WeeWX's own Seasons skin
    "Day" = "Day"
    "Week" = "Week"
    "Month" = "Month"
    "Year" = "Year"
