# skins/airgradient/lang/fr.conf
#
# French -- Français.  The plot-period tabs (Jour, Semaine, Mois, Année)
# are copied verbatim from the French lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airgradient/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Libelles : en-tete de page et titre des graphiques
        pm2_5_aqi = "Indice de qualité de l'air"
        pm2_5     = "PM2,5"
        co2       = Dioxyde de carbone
        nox       = "Oxydes d'azote"
        noxIndex  = "Indice d'oxydes d'azote"
        tvoc      = Composés organiques volatils totaux
        tvocIndex = Indice des composés organiques volatils totaux

# NO [Units] [[Labels]] HERE.  weewx.units.Formatter.get_label_string
# consults weewx.units.default_unit_label_dict FIRST and only falls back to
# the skin/lang dictionary, and airgradient.py registers aqi, aqi_color,
# tvoc_index and nox_index into that dict at import time.  A [Units] block
# in this file would therefore never render -- it would be dead text that
# looks translated.  Those four labels are the acronyms AQI, RGB, TVOC and
# NOx, which stay as they are in every language anyway.

[ImageGenerator]

    [[year_images]]

        # jour/mois au lieu de l'ordre americain mois/jour
        x_label_format = %d/%m

[Texts]

    "weewx-airgradient demo page" = "page de démonstration weewx-airgradient"
    "WeeWX-AirGradient Demo Page" = "Page de démonstration WeeWX-AirGradient"
    "Unavailable" = "Indisponible"

    # Periodes des graphiques, comme dans le skin Seasons de WeeWX
    "Day" = "Jour"
    "Week" = "Semaine"
    "Month" = "Mois"
    "Year" = "Année"
