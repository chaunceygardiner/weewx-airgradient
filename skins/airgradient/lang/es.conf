# skins/airgradient/lang/es.conf
#
# Spanish -- Español.  The plot-period tabs (Día, Semana, Mes, Año) are
# copied verbatim from the Spanish lang file of WeeWX's own Seasons
# skin (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airgradient/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Etiquetas: cabecera de la pagina y titulo de las graficas
        pm2_5_aqi = Índice de calidad del aire
        pm2_5     = "PM2,5"
        co2       = Dióxido de carbono
        nox       = Óxidos de nitrógeno
        noxIndex  = Índice de óxidos de nitrógeno
        tvoc      = Compuestos orgánicos volátiles totales
        tvocIndex = Índice de compuestos orgánicos volátiles totales

# NO [Units] [[Labels]] HERE.  weewx.units.Formatter.get_label_string
# consults weewx.units.default_unit_label_dict FIRST and only falls back to
# the skin/lang dictionary, and airgradient.py registers aqi, aqi_color,
# tvoc_index and nox_index into that dict at import time.  A [Units] block
# in this file would therefore never render -- it would be dead text that
# looks translated.  Those four labels are the acronyms AQI, RGB, TVOC and
# NOx, which stay as they are in every language anyway.

[ImageGenerator]

    [[year_images]]

        # dia/mes en lugar del orden estadounidense mes/dia
        x_label_format = %d/%m

[Texts]

    "weewx-airgradient demo page" = "página de demostración de weewx-airgradient"
    "WeeWX-AirGradient Demo Page" = "Página de demostración de WeeWX-AirGradient"
    "Unavailable" = "No disponible"

    # Periodos de las graficas, como en el skin Seasons de WeeWX
    "Day" = "Día"
    "Week" = "Semana"
    "Month" = "Mes"
    "Year" = "Año"
