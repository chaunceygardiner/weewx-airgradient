# skins/airgradient/lang/de.conf
#
# German -- Deutsch.  The plot-period tabs (Tag, Woche, Monat, Jahr) are
# copied verbatim from the German lang file of WeeWX's own Seasons skin
# (a test pins this).  Corrections welcome -- file an issue at
# https://github.com/chaunceygardiner/weewx-airgradient/issues
#
# Keyed by the English strings of lang/en.conf, the reference
# dictionary; a key missing here falls back to English one string at a
# time.

[Labels]

    [[Generic]]

        # Beschriftungen: Seitenkopf und Titel der Diagramme
        pm2_5_aqi = Luftqualitätsindex
        pm2_5     = "PM2,5"
        co2       = Kohlendioxid
        nox       = Stickoxide
        noxIndex  = Stickoxid-Index
        # Ohne "gesamt": das ausgeschriebene deutsche Wort passt nicht in
        # die 500 Pixel breiten Diagramme -- und die Achsenbeschriftung
        # nennt ohnehin TVOC, das T steht fuer total.
        tvoc      = "Flüchtige organische Verbindungen"
        tvocIndex = "Index flüchtiger organischer Verbindungen"

# NO [Units] [[Labels]] HERE.  weewx.units.Formatter.get_label_string
# consults weewx.units.default_unit_label_dict FIRST and only falls back to
# the skin/lang dictionary, and airgradient.py registers aqi, aqi_color,
# tvoc_index and nox_index into that dict at import time.  A [Units] block
# in this file would therefore never render -- it would be dead text that
# looks translated.  Those four labels are the acronyms AQI, RGB, TVOC and
# NOx, which stay as they are in every language anyway.

[ImageGenerator]

    [[year_images]]

        # Tag.Monat statt der US-Reihenfolge Monat/Tag
        x_label_format = %d.%m.

[Texts]

    "weewx-airgradient demo page" = "weewx-airgradient-Demoseite"
    "WeeWX-AirGradient Demo Page" = "WeeWX-AirGradient-Demoseite"
    "Unavailable" = "Nicht verfügbar"

    # Diagramm-Zeitraeume, wie im Seasons-Skin von WeeWX
    "Day" = "Tag"
    "Week" = "Woche"
    "Month" = "Monat"
    "Year" = "Jahr"
